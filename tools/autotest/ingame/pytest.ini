[pytest]
# The in-game test system (docs/ingame-tests.md). Each test's own deadline is its budget marker (pair.Deadline: the
# test fails 'timeout' by itself). pytest-timeout is only the backstop for a call that never returns: on Windows it
# can only end the whole worker (thread method), so it sits well above every budget.
timeout = 1800
timeout_method = thread
timeout_func_only = true
addopts = -p no:cacheprovider -p no:randomly
testpaths = .
python_files = test_*.py
